name: crawl
on:
  # Resumed 2026-10-05. Every listing now records the env it was taken under
  # (86f24c7) and placeholders only reach credential-shaped variables (d73af2c).
  # Badges say when they last looked and how wide a change window is (badge.js).
  schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20' }

      # Untrusted npm packages. This job must never see LOG_PRIVATE_KEY.
      # A failed crawl must fail the job: do not use if: always() here.
      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 100
        run: node crawler/crawl.js --allow-exec --concurrency 3 --delay-ms 200 --limit 600

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crawl-data
          path: |
            data/log.ndjson
            data/state.json
            data/last-crawl.json
            data/crawls.ndjson
          retention-days: 7

  sign:
    # Default skip-on-failure is not enough to document. A failed crawl
    # must never reach a runner that holds the signing key. The 2026-09-04
    # scheduled run used if: always() in a single job and signed a partial
    # crawl (52d6ac1). That is forbidden.
    needs: crawl
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20' }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crawl-data
          path: data

      - name: Sign the log head
        env:
          LOG_PRIVATE_KEY: ${{ secrets.LOG_PRIVATE_KEY }}
        run: |
          node -e "
          const fs=require('fs');
          const {PublicLog,parsePublicKeyFile}=require('./crawler/log');
          const l=new PublicLog('data');
          const h=l.signHead();
          console.log('signed head, tree_size', h.tree_size);
          const trusted=parsePublicKeyFile(fs.readFileSync('PUBLIC_KEY.txt','utf8'));
          const v=l.verify({trustedPublicKey:trusted});
          if(!v.ok){ console.error('verify failed after signing:', v.reason); process.exit(1); }
          "

      - name: Verify the log before anything is published
        run: node bin/attest.js verify-log data

      # The crawl job never holds the key, so crawl.js writes log_verified: false.
      # Both checks above passed on this runner, so the published summary says so.
      - name: Record the verification in the crawl summary
        run: |
          node -e "
          const fs=require('fs');
          const p='data/last-crawl.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          const h=JSON.parse(fs.readFileSync('data/head.json','utf8'));
          s.log_verified=true;
          s.log_signed_at=h.signed_at;
          fs.writeFileSync(p, JSON.stringify(s,null,2));
          "

      # On the 1st, the drift report for the month that just ended, counted
      # from the log verified above.
      - name: Monthly drift report
        run: |
          if [ "$(date -u +%d)" = "01" ]; then node crawler/drift-report.js; fi

      - name: Build the site
        run: node site/build.js

      - name: Commit the log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="data/log.ndjson data/head.json data/state.json data/last-crawl.json data/crawls.ndjson"
          [ -d data/reports ] && files="$files data/reports"
          git add $files
          git diff --staged --quiet && exit 0
          git commit -m "crawl: $(date -u +%F)"
          signed=$(git rev-parse HEAD)
          # main can move while the crawl runs (about 45 minutes). Run
          # 37250226586 signed a full crawl and lost it to a rejected push.
          # Replay the commit on the new main, but only if the files pushed
          # are still exactly the ones signed and verified above. A conflict
          # or any change to them fails the job. Never force.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            git diff --quiet "$signed" HEAD -- $files
          done
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: site, path: public, retention-days: 30 }
