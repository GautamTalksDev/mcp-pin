name: crawl
on:
  # Disabled until a pagination-complete re-crawl has been verified. The
  # crawler used to issue one tools/list and ignore nextCursor, so any
  # paginated server in the public log is a truncated record. Re-enable
  # the schedule after that re-crawl, not before.
  # schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Downloads and executes third-party npm packages. No secrets besides
      # the default read-only token. The log signing key is never available
      # on this runner: a compromised crawl must not be able to sign a head.
      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 100
        run: node crawler/crawl.js --allow-exec --concurrency 3 --delay-ms 200 --limit 600

      - uses: actions/upload-artifact@v4
        with:
          name: crawl-data
          path: |
            data/log.ndjson
            data/state.json
            data/last-crawl.json
          retention-days: 7

  sign:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/download-artifact@v4
        with:
          name: crawl-data
          path: data

      - name: Sign the log head
        env:
          LOG_PRIVATE_KEY: ${{ secrets.LOG_PRIVATE_KEY }}
        run: |
          node -e "
          const fs=require('fs');
          const {PublicLog,parsePublicKeyFile}=require('./crawler/log');
          const l=new PublicLog('data');
          const h=l.signHead();
          console.log('signed head, tree_size', h.tree_size);
          const trusted=parsePublicKeyFile(fs.readFileSync('PUBLIC_KEY.txt','utf8'));
          const v=l.verify({trustedPublicKey:trusted});
          if(!v.ok){ console.error('verify failed after signing:', v.reason); process.exit(1); }
          "

      - name: Verify the log before anything is published
        run: node bin/attest.js verify-log data

      - name: Build the site
        run: node site/build.js

      - name: Commit the log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/log.ndjson data/head.json data/state.json data/last-crawl.json
          git diff --staged --quiet || git commit -m "crawl: $(date -u +%F)"
          git push

      - uses: actions/upload-artifact@v4
        with: { name: site, path: public, retention-days: 30 }
