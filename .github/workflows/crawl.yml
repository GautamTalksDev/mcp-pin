name: crawl
on:
  schedule: [{ cron: '0 6 * * *' }]   # 06:00 UTC daily
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # This step downloads and executes third-party npm packages. It runs
      # only on this ephemeral runner, with no secrets mounted beyond the
      # default read-only token. The log signing key is deliberately NOT
      # available here: a compromised crawl must not be able to sign a head.
      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Bounded well under the job timeout so the commit step always runs.
        # A partial crawl that gets committed beats a complete one that does not.
        timeout-minutes: 100
        run: node crawler/crawl.js --allow-exec --concurrency 3 --delay-ms 200 --limit 600

      # Sign as a separate step. When this was done inside the crawl process
      # the head silently stayed stale while 233 entries were appended, and
      # the failure only surfaced at verify time.
      - name: Sign the log head
        if: always()
        env:
          LOG_PRIVATE_KEY: ${{ secrets.LOG_PRIVATE_KEY }}
        run: |
          node -e "
          const {PublicLog}=require('./crawler/log');
          const l=new PublicLog('data');
          const h=l.signHead();
          console.log('signed head, tree_size', h.tree_size);
          const v=l.verify();
          if(!v.ok){ console.error('verify failed after signing:', v.reason); process.exit(1); }
          "

      - name: Verify the log before anything is published
        if: always()
        run: node bin/attest.js verify-log data

      - name: Build the site
        if: always()
        run: node site/build.js

      - name: Commit the log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/log.ndjson data/head.json data/state.json data/last-crawl.json
          git diff --staged --quiet || git commit -m "crawl: $(date -u +%F)"
          git push

      - uses: actions/upload-artifact@v4
        with: { name: site, path: public, retention-days: 30 }
