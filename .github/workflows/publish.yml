# Publish to npm with provenance, so anyone can verify the tarball was built
# from this repo at this commit rather than uploaded from a laptop.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write        # OIDC identity for npm Trusted Publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: node test/run.js
      - run: npm publish --provenance --access public
