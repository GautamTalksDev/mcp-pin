# OpenSSF Scorecard: an independent check of this repository's security practices,
# published so anyone evaluating mcp-pin can read the score instead of trusting a claim.
name: scorecard
on:
  branch_protection_rule:
  schedule: [{ cron: '23 7 * * 1' }]
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results to the OpenSSF API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
