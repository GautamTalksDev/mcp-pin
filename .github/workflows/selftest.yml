# The action, run against this repo's own demo server. If mcp-pin cannot
# detect drift in its own CI, it has no business being in anyone else's.
name: action selftest
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20' }
      - name: Fingerprint the demo server
        uses: ./
        with:
          command: node
          args: demo/rugpull-server.js
          baseline: .mcp-pin/demo.json
          comment: false
